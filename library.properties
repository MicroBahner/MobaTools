paragraph=Bibliothek mit Funktionen für <b>Schrittmotore, Servos, Leds und zum entprellten Einlesen von Tastern/Schaltern</b>, für arduino uno/Nano R2/R3/R4, mini, nano, leonardo, micro and mega, some ATtiny, STM32, SamD and ESP32(Sx/Cx) und ESP8266<br />- Steuern von bis zu <b>16 Servos</b> mit Geschwindigkeitskontrolle. <br />- Bis zu <b>6 Schrittmotore</b> mit <b>Beschleunigungs/Bremsfunktion</b><br />- Funktionen zum weichen <b>auf/abblenden von Leds</b>.<br />- Zeitgeberfunktion.<br />- Einlesen von <b>bis zu 32 Tastern/Schaltern</b> mit Ereignisfunktionen<br> <br> This library can control<br>- up to 16 <b>servos with speed control</b> and<br> - up to 6 <b>stepper motors with accelerating and decelerating</b>.<br>- There are also functions for a <b>bulb simulation with leds</b>.<br />- Reading of <b>up to 32 buttons/switchws with event functions</b><br>It intensively uses timer functions. THe used timer depends on the used board.<br>
